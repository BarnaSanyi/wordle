<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Wordle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>WORDLE</h1>
            
            <div class="header-actions">
                <button id="leaderboard-btn" class="profile-btn">🏆</button>
                
                <div class="user-menu-container">
                    <button id="profile-btn" class="profile-btn">👤</button>
                    <div id="dropdown-menu" class="dropdown-menu">
                        
                        <!-- ÚJ: MOBIL HUD (Csak telefonon látszik a menüben) -->
                        <div id="hud-mobile" class="hud-mobile">
                            <div class="hud-item">
                                <span class="hud-label">Pontok</span>
                                <div>
                                    <span class="hud-score hud-value">0</span>
                                    <span class="hud-rank-score hud-rank">#-</span>
                                </div>
                            </div>
                            <div class="hud-item">
                                <span class="hud-label">Széria</span>
                                <div>
                                    <span class="hud-streak hud-value">0</span>
                                    <span class="hud-rank-streak hud-rank">#-</span>
                                </div>
                            </div>
                            <div class="hud-item">
                                <span class="hud-label">Átlag</span>
                                <div>
                                    <span class="hud-avg hud-value">0</span>
                                    <span class="hud-rank-avg hud-rank">#-</span>
                                </div>
                            </div>
                        </div>

                        <button id="logout-btn">Kijelentkezés</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- DESKTOP HUD (Csak gépen látszik, középre igazítva) -->
        <div id="player-hud" class="glass-panel hud-panel">
            <div class="hud-item">
                <span class="hud-label">Pontok</span>
                <span class="hud-score hud-value">0</span>
                <span class="hud-rank-score hud-rank">#-</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Széria</span>
                <span class="hud-streak hud-value">0</span>
                <span class="hud-rank-streak hud-rank">#-</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Átlag</span>
                <span class="hud-avg hud-value">0</span>
                <span class="hud-rank-avg hud-rank">#-</span>
            </div>
        </div>
        
        <div id="board-container">
            <div id="board"></div>
        </div>

        <div id="message-container"></div>
        
        <!-- Az Új játék gomb, alapértelmezetten elrejtve -->
        <button id="play-again-btn">Új játék</button>

        <div id="keyboard-container">
            <!-- A billentyűzetet a JS generálja -->
        </div>
    </div>

    <!-- ÚJ: RANGLISTA FELUGRÓ ABLAK (MODAL) -->
    <div id="leaderboard-modal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <button id="close-modal">&times;</button>
            <h2>Csillagközi Ranglista</h2>
            
            <!-- A 3 fül -->
            <div class="tabs">
                <button class="tab-btn active" data-target="board-score">Galaktikus Pontok</button>
                <button class="tab-btn" data-target="board-streak">Nyerő Széria</button>
                <button class="tab-btn" data-target="board-average">Precízió (Átlag)</button>
            </div>

            <!-- A táblázatok helye -->
            <div class="boards-container">
                <div id="board-score" class="board active">Betöltés...</div>
                <div id="board-streak" class="board">Betöltés...</div>
                <div id="board-average" class="board">Betöltés...</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
